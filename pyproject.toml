[project]
name = "area-validation-api"
version = "0.1.0"
description = "Stateless Web3 GIS polygon overlap validator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "web3>=6.20.0",
  "aiohttp>=3.10.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0",
  "pydantic-settings>=2.4.0",
  "pytest-cov>=5.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
